<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electron Flow</title><meta name="description" content="Interactive acid–base and resonance practice with precise structures, draggable curly arrows, and progressive hints."><link rel="stylesheet" href="style.css?v=45"></head>
<body><main><header><span class="brand">Electron Flow</span></header><div class="heading"><h1>Curly Arrow Practice</h1><p>Choose a topic and difficulty, then draw the complete set of arrows.</p></div>
<div class="topic-picker" role="group" aria-label="Practice topic"><button id="topic-intro" aria-pressed="false">Intro <span>15</span></button><button id="topic-resonance" aria-pressed="true">Resonance <span>60</span></button><button id="topic-acid" aria-pressed="false">Acid–base <span>60</span></button></div>
<div id="level-picker" class="level-picker" role="group" aria-label="Difficulty"><button id="level-easy" aria-pressed="true">Easy <span>20</span></button><button id="level-moderate" aria-pressed="false">Moderate <span>20</span></button><button id="level-hard" aria-pressed="false">Hard <span>20</span></button></div>
<label class="question-picker" for="question-select">Choose a question<select id="question-select"></select></label>
<section class="game"><div class="top"><span id="count"></span><span id="score"></span></div><div class="track"><div id="progress"></div></div><p class="family" id="family"></p><h2 id="title"></h2><p id="context"></p>
<div id="intro-options" class="intro-options" hidden></div><div class="reaction-grid" id="reaction-grid"><div class="reaction-labels"><h3 id="left-label"></h3><h3 id="right-label"></h3></div><div id="drawing"></div><div id="relation" hidden></div><div id="product-drawing" hidden></div><div class="reaction-roles"><div class="roles" id="reactant-roles"></div><div class="roles" id="product-roles"></div></div></div>
<div class="instruction" id="instruction"></div><p class="keyboard-help" id="keyboard-help">Select a pair, then drag its arrowhead or tap its destination. Keyboard: Tab and Enter; Esc clears a selection.</p><div id="feedback" role="status" aria-live="polite"></div>
<div class="bottom"><button id="reset" class="quiet">Restart question</button><button id="hint">Hint</button><button id="undo">Undo arrow</button><button id="clear">Clear arrows</button><button class="primary" id="check">Check arrows</button><button class="primary" id="next" hidden>Next question →</button></div></section>
</main><script src="bank.js?v=45"></script><script src="geometry.js?v=45"></script><script src="intro.js?v=45"></script><script src="game.js?v=45"></script></body></html>
